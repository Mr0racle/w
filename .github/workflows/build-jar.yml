name: Build JAR

# Builds the mod, runs the unit tests and the GameTest server, and attaches the NeoForge JAR
# to the run so it can be downloaded without building locally. A pushed version tag (v1.3.0)
# also publishes a GitHub Release with the JAR.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the release step below writes; it runs for version tags.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: bash ./gradlew build runGameTestServer --no-daemon --stacktrace
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: wcpu-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev*.jar
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls neoforge/build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$jar" --title "wcpu ${GITHUB_REF_NAME#v}" \
            --generate-notes --verify-tag
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            run/gametest/logs/**
          if-no-files-found: ignore
          retention-days: 7
