name: Build JAR

# Builds the mod, runs the unit tests and the GameTest server, and attaches the NeoForge JAR
# to the run so it can be downloaded without building locally. A push to main whose
# mod_version has no release yet (v1.3.0, ...) also publishes one with the JAR attached.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only the release step below writes; it runs for pushes to main with a new version.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: bash ./gradlew build runGameTestServer --no-daemon --stacktrace
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: wcpu-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev*.jar
          if-no-files-found: error
      - name: Publish release for a new version
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"
            exit 0
          fi
          jar=$(ls neoforge/build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          flags=""
          case "$version" in 1.2.*) flags="--prerelease" ;; esac
          gh release create "$tag" "$jar" --target "$GITHUB_SHA" --title "wcpu ${version}" \
            --generate-notes $flags
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            run/gametest/logs/**
          if-no-files-found: ignore
          retention-days: 7
